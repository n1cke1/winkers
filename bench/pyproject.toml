[project]
name = "graph-mcp-bench"
version = "0.1.0"
description = "Benchmark: how code graph MCP servers affect coding agent quality"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
viz = [
    "matplotlib>=3.8",
]

[project.scripts]
gmb = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["bench*", "adapters*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
